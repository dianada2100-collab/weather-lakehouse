[project]
name = "weather-pipeline"
version = "0.1.0"
description = "Small end-to-end data pipeline: Open-Meteo API -> S3 (bronze/silver/gold) -> Athena"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "requests>=2.31",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "python_practice"]
